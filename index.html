<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JN Calc | Joaquim Neto</title>

<style>
* {
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    margin: 0;
    background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* APP */
.app {
    width: 320px;
    background: #121212;
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    animation: fadeInUp 0.6s ease;
}

/* TÍTULO */
.title {
    text-align: center;
    color: #d4af37;
    font-weight: bold;
    margin-bottom: 10px;
    letter-spacing: 2px;
}

/* ANIMAÇÃO */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* DISPLAY PREMIUM */
.display {
    background: linear-gradient(145deg, #000, #1a1a1a);
    box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
    color: #fff;
    font-size: 34px;
    text-align: right;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    overflow-x: auto;
    transition: all 0.2s ease;
}

/* FLASH */
.display.flash {
    animation: flash 0.3s ease;
}

@keyframes flash {
    0% { background: #000; }
    50% { background: #1b5e20; }
    100% { background: #000; }
}

/* BOTÕES */
.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

button {
    padding: 18px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: #1f1f1f;
    color: white;
    transition: all 0.15s ease;
}

/* HOVER PREMIUM */
button:hover {
    background: #2c2c2c;
    transform: translateY(-2px);
}

/* PRESS */
button:active {
    transform: scale(0.92);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
}

/* ESPECIAIS */
.operator {
    background: linear-gradient(135deg, #d4af37, #b8962e);
    color: black;
    font-weight: bold;
}

.equal {
    background: linear-gradient(135deg, #00c853, #00a844);
    color: black;
    grid-column: span 2;
    font-weight: bold;
}

.clear {
    background: #ff5252;
}

/* GLOW */
button.glow {
    box-shadow: 0 0 10px #d4af37;
}

/* FOOTER */
.footer {
    text-align: center;
    margin-top: 15px;
    font-size: 11px;
    color: #777;
}

/* RESPONSIVO */
@media (max-width: 400px) {
    .app {
        width: 95%;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="title">JN CALC</div>

    <div id="display" class="display">0</div>

    <div class="buttons">
        <button class="clear" onclick="clearAll()">C</button>
        <button onclick="press(this, '%')">%</button>
        <button onclick="press(this, '/')">÷</button>
        <button class="operator" onclick="press(this, '*')">×</button>

        <button onclick="press(this, '7')">7</button>
        <button onclick="press(this, '8')">8</button>
        <button onclick="press(this, '9')">9</button>
        <button class="operator" onclick="press(this, '-')">−</button>

        <button onclick="press(this, '4')">4</button>
        <button onclick="press(this, '5')">5</button>
        <button onclick="press(this, '6')">6</button>
        <button class="operator" onclick="press(this, '+')">+</button>

        <button onclick="press(this, '1')">1</button>
        <button onclick="press(this, '2')">2</button>
        <button onclick="press(this, '3')">3</button>
        <button class="equal" onclick="press(this, '='); calculate()">=</button>

        <button onclick="press(this, '0')">0</button>
        <button onclick="press(this, '.')">.</button>
    </div>

    <div class="footer">
        Joaquim Neto • Desenvolvedor
    </div>
</div>

<script>
let display = document.getElementById("display");

let current = "";
let operator = "";
let previous = "";

/* CLIQUE */
function press(btn, value) {
    btn.classList.add("glow");
    setTimeout(() => btn.classList.remove("glow"), 150);
    input(value);
}

/* LÓGICA */
function input(value) {
    if (["+", "-", "*", "/", "%"].includes(value)) {
        if (current === "") return;
        operator = value;
        previous = current;
        current = "";
    } else {
        if (value === "." && current.includes(".")) return;
        current += value;
    }
    updateDisplay(current || previous);
}

function updateDisplay(value) {
    display.innerText = value || "0";
}

function clearAll() {
    current = "";
    previous = "";
    operator = "";
    updateDisplay("0");
}

function calculate() {
    if (current === "" || previous === "") return;

    let a = parseFloat(previous);
    let b = parseFloat(current);
    let result;

    switch (operator) {
        case "+": result = a + b; break;
        case "-": result = a - b; break;
        case "*": result = a * b; break;
        case "/": result = b === 0 ? "Erro" : a / b; break;
        case "%": result = a % b; break;
    }

    current = result.toString();
    operator = "";
    previous = "";

    display.classList.add("flash");
    setTimeout(() => display.classList.remove("flash"), 300);

    updateDisplay(current);
}

/* TECLADO */
document.addEventListener("keydown", (e) => {
    if (!isNaN(e.key) || e.key === ".") input(e.key);
    if (["+", "-", "*", "/", "%"].includes(e.key)) input(e.key);
    if (e.key === "Enter") calculate();
    if (e.key === "Backspace") {
        current = current.slice(0, -1);
        updateDisplay(current || "0");
    }
    if (e.key === "Escape") clearAll();
});
</script>

</body>
</html>
